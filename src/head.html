<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>年節賀卡坊</title>
<meta name="description" content="給家中長輩的傳統喜氣賀卡，每個節日都有專屬樣板。">
<meta name="theme-color" content="#a8231f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="賀卡坊">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&display=swap">
<style>
/* 全字庫正楷體 (TW-Kai), the common 5,400 Big5 characters only; rarer characters and Latin letters fall back to LXGW WenKai TC */
@font-face{font-family:"TW-Kai";src:url("fonts/tw-kai.woff2") format("woff2");font-display:swap;unicode-range:U+2E80-9FFF,U+F900-FAFF,U+FE30-FE4F,U+FF00-FFEF}
/* Layout: one column on every screen. Settings on top, the card (one canvas, also the download) at the bottom. */
:root{
  --bg:#f5efee; --fg:#2b1a1b; --muted:#7a5f60; --line:#e2d3d2; --panel:#fffaf9;
  --chip:#efe2e1; --chip-on:#a8231f; --chip-on-fg:#fff6e6; --focus:#c8902c;
  --display:"DFKai-SB","BiauKai","標楷體","TW-Kai","LXGW WenKai TC","Kaiti TC","STKaiti","KaiTi",serif;
  --body:var(--display);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#181112; --fg:#f2e6e4; --muted:#b39c9b; --line:#3a2a2b; --panel:#211819;
  --chip:#2e2122; --chip-on:#c23a2f; --chip-on-fg:#fff6e6; --focus:#e0b04a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#181112; --fg:#f2e6e4; --muted:#b39c9b; --line:#3a2a2b; --panel:#211819;
  --chip:#2e2122; --chip-on:#c23a2f; --chip-on-fg:#fff6e6; --focus:#e0b04a; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:20px;line-height:1.6}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:max(10px,env(safe-area-inset-top)) max(48px,env(safe-area-inset-bottom));display:grid;grid-template-columns:minmax(0,1fr);gap:10px;align-items:start}
/* compact top: title + gear, then four dropdowns in two rows, so the card shows at first glance on a phone */
header.top{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px}
header.top h1{font-family:var(--display);font-weight:700;font-size:30px;margin:0;line-height:1.1}
.gear{appearance:none;font:inherit;font-size:16px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:999px;min-height:48px;padding:4px 14px;display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.gear svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2}
.gear[aria-expanded="true"]{background:var(--chip-on);border-color:var(--chip-on);color:var(--chip-on-fg)}
.controls{display:grid;gap:10px;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px}
.pick{position:relative;min-width:0}
.pick label{position:absolute;left:13px;top:5px;font-size:14px;line-height:1;color:var(--muted);pointer-events:none}
.pick select{font:inherit;font-size:20px;width:100%;min-height:60px;padding:20px 30px 4px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--fg);
  appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:right 16px top 50%,right 10px top 50%;background-size:6px 6px;background-repeat:no-repeat;text-overflow:ellipsis}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;margin:0}
.group{display:grid;gap:10px}
.label{font-size:20px;font-weight:700;letter-spacing:.12em;color:var(--fg)}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{appearance:none;border:1px solid var(--line);background:var(--chip);color:var(--fg);font:inherit;font-size:20px;min-height:52px;padding:8px 18px;border-radius:999px;cursor:pointer;display:inline-flex;gap:8px;align-items:center}
.chip small{font-size:16px;color:var(--muted);font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--chip-on);border-color:var(--chip-on);color:var(--chip-on-fg)}
.chip[aria-pressed="true"] small{color:var(--chip-on-fg);opacity:.8}
.chip:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
/* big two- or three-way switch (節日類別, 圖案風格) */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:2px solid var(--chip-on);border-radius:12px;overflow:hidden}
.seg button{appearance:none;border:0;border-left:2px solid var(--chip-on);background:var(--panel);color:var(--fg);font:inherit;font-size:22px;font-weight:700;min-height:60px;padding:8px 6px;cursor:pointer}
.seg button:first-child{border-left:0}
.seg button small{font-size:16px;font-weight:400;opacity:.8;margin-left:4px}
.seg button[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-fg)}
/* 中國／西洋 and 卡通／風景／花草／傳統 share one compact row above the dropdowns */
.segrow{display:grid;grid-template-columns:1fr 2fr;gap:10px}
.segrow .seg button{font-size:20px;min-height:50px;padding:4px 2px}
@media (max-width:380px){.pick select{font-size:18px;padding-left:10px;padding-right:24px;background-position:right 13px top 50%,right 7px top 50%}}
.field{display:grid;gap:6px}
.field input,.field select{font:inherit;font-size:20px;min-height:56px;padding:10px 14px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--fg);width:100%}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field textarea{font:inherit;font-size:20px;padding:10px 14px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--fg);width:100%;box-sizing:border-box;resize:vertical}
.menus{border:1px dashed var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:10px;background:var(--panel)}
.menus:not([open]){display:none}
.menus summary{list-style:none;font-weight:700;font-size:19px;padding:4px 0}
.menus summary::-webkit-details-marker{display:none}
#fromCustomBox[hidden],#toCustomBox[hidden]{display:none}
.actions{display:flex;gap:12px;flex-wrap:wrap}
.btn{font:inherit;font-size:20px;min-height:56px;padding:12px 22px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer}
.btn.primary{background:var(--chip-on);color:var(--chip-on-fg);border-color:var(--chip-on)}
.hint{font-size:18px;color:var(--muted);margin:0}
/* share buttons: darker brand greens so white text stays readable */
.btn.line{background:#058c3c;border-color:#058c3c;color:#fff;font-weight:600}
.btn.wx{background:#1b7a43;border-color:#1b7a43;color:#fff;font-weight:600}
a.btn{text-decoration:none;display:inline-block}
.site-bar{grid-column:1/-1;background:var(--chip-on);color:var(--chip-on-fg);border-radius:10px;padding:12px 14px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.site-bar p{margin:0;flex:1 1 240px}
.site-bar a{color:inherit;font-weight:700;word-break:break-all}
.site-bar .btn{background:var(--chip-on-fg);color:#a8231f;border-color:var(--chip-on-fg);font-weight:600}
.save-box{position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.72);display:grid;place-items:center;padding:16px;overflow:auto}
.save-box[hidden]{display:none}
.save-panel{background:var(--panel);color:var(--fg);border-radius:10px;padding:16px;max-width:460px;width:100%;display:grid;gap:12px;justify-items:center}
.save-panel img{width:100%;height:auto;max-height:70vh;object-fit:contain;border-radius:4px;-webkit-touch-callout:default;user-select:auto}
.save-panel p{margin:0;font-size:19px;text-align:center}
.install{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.install[hidden]{display:none}
.motif{font-size:18px;color:var(--muted);margin:0;border-left:2px solid var(--line);padding-left:10px}
.stage{min-width:0;display:grid;gap:10px;justify-items:center}
/* round icon buttons right under the card; each has a two-character label for elders */
.toolbar{width:100%;max-width:520px;display:flex;justify-content:space-between;gap:2px}
.shareset{display:contents}.shareset[hidden]{display:none}
.ic{appearance:none;font:inherit;font-size:16px;line-height:1.2;color:var(--fg);background:none;border:0;padding:0;flex:1 1 0;min-width:0;display:grid;justify-items:center;gap:3px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.ic i{width:clamp(48px,14vw,58px);height:clamp(48px,14vw,58px);border-radius:50%;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;box-shadow:0 2px 6px rgba(60,10,10,.18)}
.ic svg{width:28px;height:28px;fill:none;stroke:var(--chip-on);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic:active i{transform:scale(.94)}
.ic.save i{background:var(--chip-on);border-color:var(--chip-on)}.ic.save svg{stroke:#fff;stroke-width:2.4}
.ic.line i{background:#06a043;border-color:#06a043}.ic.line svg path{fill:#fff;stroke:none}
.ic.line svg text{fill:#06a043;stroke:none;font:700 5.2px Arial,sans-serif;text-anchor:middle}
.ic.wx i{background:#1b7a43;border-color:#1b7a43}.ic.wx svg{fill:#fff;stroke:none}.ic.wx .b2{stroke:#1b7a43;stroke-width:1}.ic.wx .eye{fill:#1b7a43}
.status{width:100%;max-width:520px;text-align:center;white-space:pre-line}.status:empty{display:none}
#card{width:100%;max-width:520px;height:auto;aspect-ratio:5/7;border-radius:6px;box-shadow:0 18px 40px -18px rgba(60,10,10,.55);display:block}
@media (prefers-reduced-motion:no-preference){
  #card.flip{animation:pop .45s ease-out}
  @keyframes pop{from{transform:scale(.97);opacity:.6}to{transform:none;opacity:1}}
}
</style>
</head>
<body>

<div class="wrap">
  <div class="site-bar" id="siteBar" hidden>
    <p>這是預覽版。正式網站在 <a id="siteLink" href="https://greeting-card-generator.hoya-chen.workers.dev/" target="_blank" rel="noopener">greeting-card-generator.hoya-chen.workers.dev</a>，請用正式網址安裝到手機、分享給家人，才會有「賀卡坊」圖示和 LINE／微信分享。</p>
    <button class="btn" id="siteCopy" type="button">複製正式網址</button>
  </div>
  <header class="top">
    <h1>年節賀卡坊</h1>
    <button class="gear" id="menuBtn" type="button" aria-expanded="false" aria-controls="menuBox" aria-label="設定選單：在長輩的手機上先填好名字">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg>
      <span>設定</span>
    </button>
  </header>

  <section class="controls" aria-label="賀卡設定">
    <details class="menus" id="menuBox">
      <summary>設定選單：在長輩的手機上先填好名字</summary>
      <p class="hint">長輩不用打字：拿長輩的手機打開這個網站（或桌面上的賀卡坊），在這裡填好名字按「儲存選單」，這支手機以後就只要用點的選。每行一個，或用「、」隔開。</p>
      <div class="field"><label for="menuFrom" class="hint">署名選單</label><textarea id="menuFrom" rows="3" placeholder="例如：&#10;小明&#10;小華全家"></textarea></div>
      <div class="field"><label for="menuTo" class="hint">「送給」另外加的稱呼</label><textarea id="menuTo" rows="2" placeholder="例如：&#10;老同事&#10;各位鄰居"></textarea></div>
      <div class="actions"><button class="btn primary" id="menuSave" type="button">儲存選單</button><button class="btn" id="menuClose" type="button">關閉</button></div>
      <p class="hint" id="menuNote"></p>
    </details>
    <div class="segrow">
      <div class="seg" id="catSeg" role="group" aria-label="節日類別">
        <button type="button" data-cat="cn" aria-label="中國節日">中國</button>
        <button type="button" data-cat="west" aria-label="西洋節日">西洋</button>
      </div>
      <div class="seg" id="styleSeg" role="group" aria-label="圖案風格">
        <button type="button" data-style="cartoon">卡通</button>
        <button type="button" data-style="scenery">風景</button>
        <button type="button" data-style="flower">花草</button>
        <button type="button" data-style="traditional">傳統</button>
      </div>
    </div>
    <div class="grid2">
      <div class="pick"><label for="festSel">節日</label><select id="festSel"></select></div>
      <div class="pick"><label for="yearSel">年份</label><select id="yearSel"></select></div>
      <div class="pick"><label for="toSel">送給</label>
        <select id="toSel">
          <option>爸爸媽媽</option>
          <option>爺爺奶奶</option>
          <option>外公外婆</option>
          <option>岳父岳母</option>
          <option>公公婆婆</option>
          <option>各位長輩</option>
          <option>各位同學</option>
          <option value="__custom">自己輸入…</option>
        </select>
      </div>
      <div class="pick"><label for="fromSel">署名</label><select id="fromSel"></select></div>
    </div>
    <div class="field" id="toCustomBox" hidden><label for="toCustom" class="hint">自己輸入稱呼</label><input id="toCustom" placeholder="例如：舅舅舅媽"></div>
    <div class="field" id="fromCustomBox" hidden><label for="fromIn" class="hint">自己輸入署名（可留空）</label><input id="fromIn" placeholder="例如：小明敬上"></div>
    <!-- kept for screen readers; the card itself shows the date -->
    <p class="sr" id="nextNote"></p><p class="sr" id="dateNote"></p><p class="sr" id="motifNote"></p>
  </section>

  <section class="stage" aria-label="賀卡預覽">
    <canvas id="card" width="1000" height="1400" role="img" aria-label="賀卡預覽"></canvas>
    <div class="toolbar" role="group" aria-label="賀卡功能">
      <button class="ic" id="swapArt" type="button" aria-label="換一張圖"><i><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M4 18l5-5 4 4 3-3 4 4"/></svg></i><span>換圖</span></button>
      <button class="ic" id="shuffle" type="button" aria-label="換一句祝賀文字"><i><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 11h16M4 16h9M17 15l3 3-3 3"/></svg></i><span>換句</span></button>
      <button class="ic" id="copy" type="button" aria-label="複製祝賀文字"><i><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg></i><span>複製</span></button>
      <button class="ic save" id="dl" type="button" aria-label="下載賀卡圖片"><i><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg></i><span id="dlLabel">儲存</span></button>
      <span class="shareset" id="shareBox" hidden>
        <button class="ic line" id="shareLine" type="button" aria-label="傳到 LINE"><i><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3C6.5 3 2 6.6 2 11c0 4 3.6 7.3 8.4 7.9.3.1.8.2.9.5.1.3 0 .7 0 1l-.1.9c0 .3-.2 1 .9.5s6-3.5 8.2-6C21.4 14.4 22 12.8 22 11c0-4.4-4.5-8-10-8z"/><text x="12" y="13.3">LINE</text></svg></i><span>LINE</span></button>
        <button class="ic wx" id="shareWx" type="button" aria-label="傳到微信"><i><svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="9.5" cy="10" rx="7" ry="5.6"/><ellipse class="b2" cx="15.5" cy="14.5" rx="6" ry="4.8"/><circle class="eye" cx="7.3" cy="8.8" r=".9"/><circle class="eye" cx="11.6" cy="8.8" r=".9"/></svg></i><span>微信</span></button>
      </span>
    </div>
    <p class="hint status" id="copyNote" role="status"></p>
    <p class="hint status" id="shareNote" role="status"></p>
  </section>

  <div class="group install" id="installBox" hidden>
    <button class="btn" id="installBtn" type="button" hidden>安裝到手機桌面</button>
    <p class="hint" id="installNote"></p>
  </div>
</div>

<div class="save-box" id="saveBox" role="dialog" aria-modal="true" aria-label="儲存賀卡圖片" hidden>
  <div class="save-panel">
    <img id="saveImg" alt="">
    <p id="saveTip"></p>
    <a class="btn line" id="saveLine" target="_blank" rel="noopener" hidden>用 LINE 傳祝賀文字</a>
    <button class="btn primary" id="saveClose" type="button">關閉</button>
  </div>
</div>

<script>
