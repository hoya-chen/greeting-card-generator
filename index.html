<html lang="zh-Hant">
<head>
<meta charset="utf-8">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: controls column on the left, the card (one canvas, also the download) on the right; stacks card-first on phones. */
:root{
  --bg:#f5efee; --fg:#2b1a1b; --muted:#7a5f60; --line:#e2d3d2; --panel:#fffaf9;
  --chip:#efe2e1; --chip-on:#a8231f; --chip-on-fg:#fff6e6; --focus:#c8902c;
  --display:"LXGW WenKai TC","Kaiti TC","STKaiti","KaiTi",serif;
  --body:"Noto Serif TC","PMingLiU","Songti TC",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#181112; --fg:#f2e6e4; --muted:#b39c9b; --line:#3a2a2b; --panel:#211819;
  --chip:#2e2122; --chip-on:#c23a2f; --chip-on-fg:#fff6e6; --focus:#e0b04a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#181112; --fg:#f2e6e4; --muted:#b39c9b; --line:#3a2a2b; --panel:#211819;
  --chip:#2e2122; --chip-on:#c23a2f; --chip-on-fg:#fff6e6; --focus:#e0b04a; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.6}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:28px 48px;display:grid;grid-template-columns:minmax(0,360px) minmax(0,1fr);gap:32px;align-items:start}
header.top{grid-column:1/-1;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
header.top h1{font-family:var(--display);font-weight:700;font-size:40px;margin:0;line-height:1.1}
header.top p{margin:0;color:var(--muted)}
#yearSel{max-width:260px}
.controls{display:grid;gap:22px;min-width:0}
.group{display:grid;gap:10px}
.label{font-size:13px;letter-spacing:.12em;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{appearance:none;border:1px solid var(--line);background:var(--chip);color:var(--fg);font:inherit;font-size:14px;padding:6px 12px;border-radius:999px;cursor:pointer;display:inline-flex;gap:6px;align-items:baseline}
.chip small{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--chip-on);border-color:var(--chip-on);color:var(--chip-on-fg)}
.chip[aria-pressed="true"] small{color:var(--chip-on-fg);opacity:.8}
.chip:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.field{display:grid;gap:6px}
.field input,.field select{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--fg);width:100%}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{font:inherit;font-size:14px;padding:9px 16px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer}
.btn.primary{background:var(--chip-on);color:var(--chip-on-fg);border-color:var(--chip-on)}
.hint{font-size:13px;color:var(--muted);margin:0}
.motif{font-size:13px;color:var(--muted);margin:0;border-left:2px solid var(--line);padding-left:10px}
.stage{min-width:0;display:grid;gap:14px;justify-items:center}
#card{width:100%;max-width:520px;height:auto;aspect-ratio:5/7;border-radius:6px;box-shadow:0 18px 40px -18px rgba(60,10,10,.55);display:block}
@media (prefers-reduced-motion:no-preference){
  #card.flip{animation:pop .45s ease-out}
  @keyframes pop{from{transform:scale(.97);opacity:.6}to{transform:none;opacity:1}}
}
@media (max-width:760px){
  .wrap{grid-template-columns:minmax(0,1fr)}
  .stage{order:-1}
  header.top{order:-2}
}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <h1>年節賀卡坊</h1>
    <p>給家中長輩的傳統喜氣賀卡，每個節日都有專屬樣板。</p>
  </header>

  <section class="controls" aria-label="賀卡設定">
    <div class="group">
      <span class="label">年份與節日</span>
      <div class="field"><label for="yearSel" class="hint">西元年</label><select id="yearSel"></select></div>
      <div class="chips" id="festChips" role="group" aria-label="節日"></div>
      <span class="hint" id="nextNote"></span>
      <p class="hint" id="dateNote"></p>
      <p class="motif" id="motifNote"></p>
    </div>

    <div class="group">
      <span class="label">稱呼與署名</span>
      <div class="field">
        <label for="toSel" class="hint">送給</label>
        <select id="toSel">
          <option>爸爸媽媽</option>
          <option>爺爺奶奶</option>
          <option>外公外婆</option>
          <option>岳父岳母</option>
          <option>公公婆婆</option>
          <option>各位長輩</option>
          <option value="__custom">自己輸入…</option>
        </select>
      </div>
      <div class="row2">
        <div class="field"><label for="toCustom" class="hint">自訂稱呼</label><input id="toCustom" placeholder="例如：舅舅舅媽" disabled></div>
        <div class="field"><label for="fromIn" class="hint">署名（可留空）</label><input id="fromIn" value="Ted" placeholder="例如：小明敬上"></div>
      </div>
    </div>

    <div class="group">
      <span class="label">祝賀文字</span>
      <div class="actions">
        <button class="btn" id="swapArt" type="button">換一張</button>
        <button class="btn" id="shuffle" type="button">換一句</button>
        <button class="btn" id="copy" type="button">複製祝賀文字</button>
        <button class="btn primary" id="dl" type="button">下載賀卡圖片</button>
      </div>
      <p class="hint" id="copyNote">每個節日有兩張圖、三種祝賀詞可換。下載的 PNG 和右邊預覽一模一樣。</p>
    </div>
  </section>

  <section class="stage" aria-label="賀卡預覽">
    <canvas id="card" width="1000" height="1400" role="img" aria-label="賀卡預覽"></canvas>
  </section>
</div>

const STEM="甲乙丙丁戊己庚辛壬癸", BRANCH="子丑寅卯辰巳午未申酉戌亥", ZOD="鼠牛虎兔龍蛇馬羊猴雞狗豬";
const ZPHRASE={子:"金鼠迎春",丑:"牛轉乾坤",寅:"虎虎生風",卯:"玉兔呈祥",辰:"龍騰盛世",巳:"金蛇獻瑞",午:"馬到成功",未:"三羊開泰",申:"金猴獻瑞",酉:"金雞報曉",戌:"旺年納福",亥:"金豬納福"};
// 元旦 (Jan 1) is always before 春節, so it still belongs to the previous lunar year
function lunarYear(f){return f.id==="newyear"?year-1:year}
function ganzhi(L){return STEM[(L-4)%10]+BRANCH[(L-4)%12]}
function occ(f){const [date,lunar]=TABLE[year][f.id];const L=lunarYear(f),gz=ganzhi(L);return {date,lunar,gz,zodiac:ZOD[(L-4)%12],zphrase:ZPHRASE[gz[1]]}}
function phraseOf(f){return fill(f.phrase,occ(f))}
function msgOf(f){return fill(f.msgs[msgIdx%f.msgs.length],occ(f))}
function fill(str,o){return str.replace(/\{Z\}/g,o.zodiac).replace(/\{P\}/g,o.zphrase)}
function dayDiff(iso){const t=new Date();t.setHours(0,0,0,0);return Math.round((new Date(iso+"T00:00:00")-t)/86400000)}

/* ---------- drawing helpers ---------- */
function rand(seed){let s=seed;return()=>{s=(s*9301+49297)%233280;return s/233280}}
function circle(x,cx,cy,r){x.beginPath();x.arc(cx,cy,r,0,Math.PI*2)}
function vText(x,str,cx,top,size,gap){x.textAlign="center";x.textBaseline="top";let y=top;for(const ch of str){x.fillText(ch,cx,y);y+=size+gap}}
function snow(x,f,seed,n,area){
  const r=rand(seed);x.save();x.strokeStyle=f.gold;x.lineWidth=2;
  for(let i=0;i<n;i++){const cx=area[0]+r()*(area[2]-area[0]),cy=area[1]+r()*(area[3]-area[1]),s=8+r()*14;x.globalAlpha=.35+r()*.4;
    x.beginPath();for(let k=0;k<6;k++){const a=k*Math.PI/3;x.moveTo(cx,cy);x.lineTo(cx+Math.cos(a)*s,cy+Math.sin(a)*s)}x.stroke()}
  x.restore();
}
function stars(x,f,seed,n,area){
  const r=rand(seed);x.save();x.fillStyle=f.gold;
  for(let i=0;i<n;i++){x.globalAlpha=.3+r()*.6;circle(x,area[0]+r()*(area[2]-area[0]),area[1]+r()*(area[3]-area[1]),1+r()*2.6);x.fill()}
  x.restore();
}
function cloud(x,f,cx,cy,s,fill){
  // 祥雲: a row of curls
  x.save();x.translate(cx,cy);x.scale(s,s);x.lineWidth=4/s;x.strokeStyle=f.gold;x.fillStyle=fill;
  x.beginPath();x.moveTo(-120,20);x.bezierCurveTo(-130,-20,-80,-40,-60,-15);x.bezierCurveTo(-55,-55,10,-60,15,-20);
  x.bezierCurveTo(30,-50,90,-40,85,-5);x.bezierCurveTo(120,-10,130,20,110,20);x.closePath();x.fill();x.stroke();
  x.beginPath();x.arc(-60,-2,14,Math.PI,Math.PI*2.4);x.stroke();x.beginPath();x.arc(15,-8,16,Math.PI,Math.PI*2.4);x.stroke();
  x.restore();
}
function lantern(x,f,cx,top,cy,s,ch){
  x.save();x.strokeStyle=f.gold;x.lineWidth=2;x.beginPath();x.moveTo(cx,top);x.lineTo(cx,cy-s*0.62);x.stroke();
  x.fillStyle=f.gold;x.fillRect(cx-s*0.26,cy-s*0.66,s*0.52,s*0.1);x.fillRect(cx-s*0.26,cy+s*0.56,s*0.52,s*0.1);
  const g=x.createRadialGradient(cx-s*.15,cy-s*.15,s*.05,cx,cy,s*.7);g.addColorStop(0,"#ff5a3c");g.addColorStop(1,"#c0140f");
  x.fillStyle=g;x.beginPath();x.ellipse(cx,cy,s*0.5,s*0.6,0,0,Math.PI*2);x.fill();
  x.strokeStyle=f.gold;x.lineWidth=1.6;x.globalAlpha=.7;
  for(const k of [-.3,0,.3]){x.beginPath();x.ellipse(cx,cy,s*0.5*Math.abs(k)*2||1,s*0.6,0,0,Math.PI*2);x.stroke()}
  x.globalAlpha=1;
  if(ch){x.fillStyle=f.gold;x.font=`700 ${Math.round(s*0.5)}px ${DISP}`;x.textAlign="center";x.textBaseline="middle";x.fillText(ch,cx,cy+s*.03)}
  x.strokeStyle=f.gold;x.lineWidth=2;for(let i=-3;i<=3;i++){x.beginPath();x.moveTo(cx+i*s*0.03,cy+s*0.66);x.lineTo(cx+i*s*0.045,cy+s*1.0);x.stroke()}
  x.restore();
}
function burst(x,f,cx,cy,r,n,color){
  x.save();x.strokeStyle=color;x.fillStyle=color;x.lineWidth=3;x.lineCap="round";
  for(let i=0;i<n;i++){const a=i*2*Math.PI/n;x.beginPath();x.moveTo(cx+Math.cos(a)*r*.3,cy+Math.sin(a)*r*.3);x.lineTo(cx+Math.cos(a)*r*.85,cy+Math.sin(a)*r*.85);x.stroke();
    circle(x,cx+Math.cos(a)*r,cy+Math.sin(a)*r,4);x.fill()}
  x.restore();
}
function mountains(x,f,base,layers){
  layers.forEach((L,i)=>{x.fillStyle=L.c;x.beginPath();x.moveTo(60,base);
    L.p.forEach(([px,py],j)=>{const prev=j?L.p[j-1]:[60,base];x.quadraticCurveTo((prev[0]+px)/2,Math.min(prev[1],py)-L.k,px,py)});
    x.lineTo(940,base);x.closePath();x.fill();
    x.strokeStyle=f.gold;x.globalAlpha=.6;x.lineWidth=2;x.stroke();x.globalAlpha=1});
}
function pine(x,f,cx,base,s){
  x.save();x.fillStyle=f.paper2;x.strokeStyle=f.gold;x.lineWidth=2.5;
  x.fillRect(cx-s*.06,base-s*.5,s*.12,s*.5);x.strokeRect(cx-s*.06,base-s*.5,s*.12,s*.5);
  [[.95,.55],[.75,.45],[.55,.36]].forEach(([y,w],i)=>{const ty=base-s*y-s*.45;x.beginPath();x.moveTo(cx,ty);x.lineTo(cx-s*w,base-s*y+s*.05);x.lineTo(cx+s*w,base-s*y+s*.05);x.closePath();x.fill();x.stroke()});
  x.restore();
}

function plum(x,cx,cy,r,col){

  x.fillStyle="#f2c75c";circle(x,cx,cy,r*.22);x.fill();
}
function branch(x,pts,w){
  x.save();x.strokeStyle="#4a2a1a";x.lineCap="round";x.lineWidth=w;x.beginPath();x.moveTo(pts[0][0],pts[0][1]);

/* ---------- full card ---------- */
function wrapLines(x,text,maxW,indentPx){
  const lines=[];let line="",first=true;
  for(const ch of text){
    const lim=first?maxW-indentPx:maxW;
    if(x.measureText(line+ch).width>lim && line){
      if("，。、！？：；」』）".includes(ch)){line+=ch;lines.push({t:line,first});line="";first=false;continue}
      lines.push({t:line,first});line=ch;first=false;
    } else line+=ch;
  }
  if(line) lines.push({t:line,first});
  return lines;
}
