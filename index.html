<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>年節賀卡坊</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Serif+TC:wght@400;600&display=swap">
<style>
/* Layout: controls column on the left, the card (one canvas, also the download) on the right; stacks card-first on phones. */
:root{
  --bg:#f5efee; --fg:#2b1a1b; --muted:#7a5f60; --line:#e2d3d2; --panel:#fffaf9;
  --chip:#efe2e1; --chip-on:#a8231f; --chip-on-fg:#fff6e6; --focus:#c8902c;
  --display:"LXGW WenKai TC","Kaiti TC","STKaiti","KaiTi",serif;
  --body:"Noto Serif TC","PMingLiU","Songti TC",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#181112; --fg:#f2e6e4; --muted:#b39c9b; --line:#3a2a2b; --panel:#211819;
  --chip:#2e2122; --chip-on:#c23a2f; --chip-on-fg:#fff6e6; --focus:#e0b04a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#181112; --fg:#f2e6e4; --muted:#b39c9b; --line:#3a2a2b; --panel:#211819;
  --chip:#2e2122; --chip-on:#c23a2f; --chip-on-fg:#fff6e6; --focus:#e0b04a; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.6}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:28px 48px;display:grid;grid-template-columns:minmax(0,360px) minmax(0,1fr);gap:32px;align-items:start}
header.top{grid-column:1/-1;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
header.top h1{font-family:var(--display);font-weight:700;font-size:40px;margin:0;line-height:1.1}
header.top p{margin:0;color:var(--muted)}
#yearSel{max-width:260px}
.controls{display:grid;gap:22px;min-width:0}
.group{display:grid;gap:10px}
.label{font-size:13px;letter-spacing:.12em;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{appearance:none;border:1px solid var(--line);background:var(--chip);color:var(--fg);font:inherit;font-size:14px;padding:6px 12px;border-radius:999px;cursor:pointer;display:inline-flex;gap:6px;align-items:baseline}
.chip small{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--chip-on);border-color:var(--chip-on);color:var(--chip-on-fg)}
.chip[aria-pressed="true"] small{color:var(--chip-on-fg);opacity:.8}
.chip:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.field{display:grid;gap:6px}
.field input,.field select{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--fg);width:100%}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{font:inherit;font-size:14px;padding:9px 16px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer}
.btn.primary{background:var(--chip-on);color:var(--chip-on-fg);border-color:var(--chip-on)}
.hint{font-size:13px;color:var(--muted);margin:0}
.motif{font-size:13px;color:var(--muted);margin:0;border-left:2px solid var(--line);padding-left:10px}
.stage{min-width:0;display:grid;gap:14px;justify-items:center}
#card{width:100%;max-width:520px;height:auto;aspect-ratio:5/7;border-radius:6px;box-shadow:0 18px 40px -18px rgba(60,10,10,.55);display:block}
@media (prefers-reduced-motion:no-preference){
  #card.flip{animation:pop .45s ease-out}
  @keyframes pop{from{transform:scale(.97);opacity:.6}to{transform:none;opacity:1}}
}
@media (max-width:760px){
  .wrap{grid-template-columns:minmax(0,1fr)}
  .stage{order:-1}
  header.top{order:-2}
}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <h1>年節賀卡坊</h1>
    <p>給家中長輩的傳統喜氣賀卡，每個節日都有專屬樣板。</p>
  </header>

  <section class="controls" aria-label="賀卡設定">
    <div class="group">
      <span class="label">年份與節日</span>
      <div class="field"><label for="yearSel" class="hint">西元年</label><select id="yearSel"></select></div>
      <div class="chips" id="festChips" role="group" aria-label="節日"></div>
      <span class="hint" id="nextNote"></span>
      <p class="hint" id="dateNote"></p>
      <p class="motif" id="motifNote"></p>
    </div>

    <div class="group">
      <span class="label">稱呼與署名</span>
      <div class="field">
        <label for="toSel" class="hint">送給</label>
        <select id="toSel">
          <option>爸爸媽媽</option>
          <option>爺爺奶奶</option>
          <option>外公外婆</option>
          <option>岳父岳母</option>
          <option>公公婆婆</option>
          <option>各位長輩</option>
          <option value="__custom">自己輸入…</option>
        </select>
      </div>
      <div class="row2">
        <div class="field"><label for="toCustom" class="hint">自訂稱呼</label><input id="toCustom" placeholder="例如：舅舅舅媽" disabled></div>
        <div class="field"><label for="fromIn" class="hint">署名（可留空）</label><input id="fromIn" value="Ted" placeholder="例如：小明敬上"></div>
      </div>
    </div>

    <div class="group">
      <span class="label">祝賀文字</span>
      <div class="actions">
        <button class="btn" id="swapArt" type="button">換一張</button>
        <button class="btn" id="shuffle" type="button">換一句</button>
        <button class="btn" id="copy" type="button">複製祝賀文字</button>
        <button class="btn primary" id="dl" type="button">下載賀卡圖片</button>
      </div>
      <p class="hint" id="copyNote">每個節日有 10 張圖、20 句吉祥話可換。下載的 PNG 和右邊預覽一模一樣。</p>
    </div>
  </section>

  <section class="stage" aria-label="賀卡預覽">
    <canvas id="card" width="1000" height="1400" role="img" aria-label="賀卡預覽"></canvas>
  </section>
</div>

<script>
const INK = "#fff3dc";
const FESTS = [];
function registerFest(def){FESTS.push(def)}
const $ = id => document.getElementById(id);
const W = 1000, H = 1400;
const DISP = '"LXGW WenKai TC","Kaiti TC","KaiTi",serif';
const BODY = '"Noto Serif TC","PMingLiU",serif';
let cur = null, msgIdx = 0, tplIdx = 0;

const CN="〇一二三四五六七八九";
function cnNum(n){if(n<=10)return n===10?"十":CN[n];const t=Math.floor(n/10),u=n%10;return (t>1?CN[t]:"")+"十"+(u?CN[u]:"")}
function fmtDate(iso){const [y,m,d]=iso.split("-").map(Number);return `${String(y).split("").map(c=>CN[c]).join("")}年${cnNum(m)}月${cnNum(d)}日`}
// [國曆日期, 農曆日期] per year and festival. Lunar festivals are checked against published tables
// (春節 2027-02-06 and 2030-02-03 follow the official calendars); other lunar dates come from the Chinese calendar.
const TABLE = {"2026":{"chongyang":["2026-10-18","九月初九"],"spring":["2026-02-17","正月初一"],"yuanxiao":["2026-03-03","正月十五"],"duanwu":["2026-06-19","五月初五"],"midautumn":["2026-09-25","八月十五"],"dongzhi":["2026-12-22","冬月十四"],"xmas":["2026-12-25","冬月十七"],"newyear":["2026-01-01","冬月十三"],"mother":["2026-05-10","三月廿四"],"father":["2026-08-08","六月廿六"]},"2027":{"chongyang":["2027-10-08","九月初九"],"spring":["2027-02-06","正月初一"],"yuanxiao":["2027-02-20","正月十五"],"duanwu":["2027-06-09","五月初五"],"midautumn":["2027-09-15","八月十五"],"dongzhi":["2027-12-22","冬月廿五"],"xmas":["2027-12-25","冬月廿八"],"newyear":["2027-01-01","冬月廿四"],"mother":["2027-05-09","四月初四"],"father":["2027-08-08","七月初七"]},"2028":{"chongyang":["2028-10-26","九月初九"],"spring":["2028-01-26","正月初一"],"yuanxiao":["2028-02-09","正月十五"],"duanwu":["2028-05-28","五月初五"],"midautumn":["2028-10-03","八月十五"],"dongzhi":["2028-12-21","冬月初六"],"xmas":["2028-12-25","冬月初十"],"newyear":["2028-01-01","臘月初五"],"mother":["2028-05-14","四月二十"],"father":["2028-08-08","六月十八"]},"2029":{"chongyang":["2029-10-16","九月初九"],"spring":["2029-02-13","正月初一"],"yuanxiao":["2029-02-27","正月十五"],"duanwu":["2029-06-16","五月初五"],"midautumn":["2029-09-22","八月十五"],"dongzhi":["2029-12-21","冬月十七"],"xmas":["2029-12-25","冬月廿一"],"newyear":["2029-01-01","冬月十七"],"mother":["2029-05-13","四月初一"],"father":["2029-08-08","六月廿九"]},"2030":{"chongyang":["2030-10-05","九月初九"],"spring":["2030-02-03","正月初一"],"yuanxiao":["2030-02-17","正月十五"],"duanwu":["2030-06-05","五月初五"],"midautumn":["2030-09-12","八月十五"],"dongzhi":["2030-12-22","冬月廿八"],"xmas":["2030-12-25","臘月初一"],"newyear":["2030-01-01","冬月廿八"],"mother":["2030-05-12","四月十一"],"father":["2030-08-08","七月初十"]},"2031":{"chongyang":["2031-10-24","九月初九"],"spring":["2031-01-23","正月初一"],"yuanxiao":["2031-02-06","正月十五"],"duanwu":["2031-06-24","五月初五"],"midautumn":["2031-10-01","八月十五"],"dongzhi":["2031-12-22","冬月初九"],"xmas":["2031-12-25","冬月十二"],"newyear":["2031-01-01","臘月初八"],"mother":["2031-05-11","閏三月二十"],"father":["2031-08-08","六月廿一"]},"2032":{"chongyang":["2032-10-12","九月初九"],"spring":["2032-02-11","正月初一"],"yuanxiao":["2032-02-25","正月十五"],"duanwu":["2032-06-12","五月初五"],"midautumn":["2032-09-19","八月十五"],"dongzhi":["2032-12-21","冬月十九"],"xmas":["2032-12-25","冬月廿三"],"newyear":["2032-01-01","冬月十九"],"mother":["2032-05-09","四月初一"],"father":["2032-08-08","七月初三"]},"2033":{"chongyang":["2033-10-01","九月初九"],"spring":["2033-01-31","正月初一"],"yuanxiao":["2033-02-14","正月十五"],"duanwu":["2033-06-01","五月初五"],"midautumn":["2033-09-08","八月十五"],"dongzhi":["2033-12-21","冬月三十"],"xmas":["2033-12-25","閏冬月初四"],"newyear":["2033-01-01","臘月初一"],"mother":["2033-05-08","四月初十"],"father":["2033-08-08","七月十四"]},"2034":{"chongyang":["2034-10-20","九月初九"],"spring":["2034-02-19","正月初一"],"yuanxiao":["2034-03-05","正月十五"],"duanwu":["2034-06-20","五月初五"],"midautumn":["2034-09-27","八月十五"],"dongzhi":["2034-12-22","冬月十二"],"xmas":["2034-12-25","冬月十五"],"newyear":["2034-01-01","閏冬月十一"],"mother":["2034-05-14","三月廿六"],"father":["2034-08-08","六月廿四"]},"2035":{"chongyang":["2035-10-09","九月初九"],"spring":["2035-02-08","正月初一"],"yuanxiao":["2035-02-22","正月十五"],"duanwu":["2035-06-10","五月初五"],"midautumn":["2035-09-16","八月十五"],"dongzhi":["2035-12-22","冬月廿三"],"xmas":["2035-12-25","冬月廿六"],"newyear":["2035-01-01","冬月廿二"],"mother":["2035-05-13","四月初六"],"father":["2035-08-08","七月初五"]},"2036":{"chongyang":["2036-10-27","九月初九"],"spring":["2036-01-28","正月初一"],"yuanxiao":["2036-02-11","正月十五"],"duanwu":["2036-05-30","五月初五"],"midautumn":["2036-10-04","八月十五"],"dongzhi":["2036-12-21","冬月初五"],"xmas":["2036-12-25","冬月初九"],"newyear":["2036-01-01","臘月初四"],"mother":["2036-05-11","四月十六"],"father":["2036-08-08","閏六月十七"]}};
const YEARS = Object.keys(TABLE).map(Number);
let year = YEARS[0];
const STEM="甲乙丙丁戊己庚辛壬癸", BRANCH="子丑寅卯辰巳午未申酉戌亥", ZOD="鼠牛虎兔龍蛇馬羊猴雞狗豬";
const ZPHRASE={子:"金鼠迎春",丑:"牛轉乾坤",寅:"虎虎生風",卯:"玉兔呈祥",辰:"龍騰盛世",巳:"金蛇獻瑞",午:"馬到成功",未:"三羊開泰",申:"金猴獻瑞",酉:"金雞報曉",戌:"旺年納福",亥:"金豬納福"};
// 元旦 (Jan 1) is always before 春節, so it still belongs to the previous lunar year
function lunarYear(f){return f.id==="newyear"?year-1:year}
function ganzhi(L){return STEM[(L-4)%10]+BRANCH[(L-4)%12]}
function occ(f){const [date,lunar]=TABLE[year][f.id];const L=lunarYear(f),gz=ganzhi(L);return {date,lunar,gz,zodiac:ZOD[(L-4)%12],zphrase:ZPHRASE[gz[1]]}}
function phraseOf(f){return fill(f.phrase,occ(f))}
function msgOf(f){return fill(f.msgs[msgIdx%f.msgs.length],occ(f))}
function fill(str,o){return str.replace(/\{Z\}/g,o.zodiac).replace(/\{P\}/g,o.zphrase)}
function dayDiff(iso){const t=new Date();t.setHours(0,0,0,0);return Math.round((new Date(iso+"T00:00:00")-t)/86400000)}

/* ---------- drawing helpers ---------- */
function rand(seed){let s=seed;return()=>{s=(s*9301+49297)%233280;return s/233280}}
function circle(x,cx,cy,r){x.beginPath();x.arc(cx,cy,r,0,Math.PI*2)}
function vText(x,str,cx,top,size,gap){x.textAlign="center";x.textBaseline="top";let y=top;for(const ch of str){x.fillText(ch,cx,y);y+=size+gap}}
function snow(x,f,seed,n,area){
  const r=rand(seed);x.save();x.strokeStyle=f.gold;x.lineWidth=2;
  for(let i=0;i<n;i++){const cx=area[0]+r()*(area[2]-area[0]),cy=area[1]+r()*(area[3]-area[1]),s=8+r()*14;x.globalAlpha=.35+r()*.4;
    x.beginPath();for(let k=0;k<6;k++){const a=k*Math.PI/3;x.moveTo(cx,cy);x.lineTo(cx+Math.cos(a)*s,cy+Math.sin(a)*s)}x.stroke()}
  x.restore();
}
function stars(x,f,seed,n,area){
  const r=rand(seed);x.save();x.fillStyle=f.gold;
  for(let i=0;i<n;i++){x.globalAlpha=.3+r()*.6;circle(x,area[0]+r()*(area[2]-area[0]),area[1]+r()*(area[3]-area[1]),1+r()*2.6);x.fill()}
  x.restore();
}
function cloud(x,f,cx,cy,s,fill){
  // 祥雲: a row of curls
  x.save();x.translate(cx,cy);x.scale(s,s);x.lineWidth=4/s;x.strokeStyle=f.gold;x.fillStyle=fill;
  x.beginPath();x.moveTo(-120,20);x.bezierCurveTo(-130,-20,-80,-40,-60,-15);x.bezierCurveTo(-55,-55,10,-60,15,-20);
  x.bezierCurveTo(30,-50,90,-40,85,-5);x.bezierCurveTo(120,-10,130,20,110,20);x.closePath();x.fill();x.stroke();
  x.beginPath();x.arc(-60,-2,14,Math.PI,Math.PI*2.4);x.stroke();x.beginPath();x.arc(15,-8,16,Math.PI,Math.PI*2.4);x.stroke();
  x.restore();
}
function lantern(x,f,cx,top,cy,s,ch){
  x.save();x.strokeStyle=f.gold;x.lineWidth=2;x.beginPath();x.moveTo(cx,top);x.lineTo(cx,cy-s*0.62);x.stroke();
  x.fillStyle=f.gold;x.fillRect(cx-s*0.26,cy-s*0.66,s*0.52,s*0.1);x.fillRect(cx-s*0.26,cy+s*0.56,s*0.52,s*0.1);
  const g=x.createRadialGradient(cx-s*.15,cy-s*.15,s*.05,cx,cy,s*.7);g.addColorStop(0,"#ff5a3c");g.addColorStop(1,"#c0140f");
  x.fillStyle=g;x.beginPath();x.ellipse(cx,cy,s*0.5,s*0.6,0,0,Math.PI*2);x.fill();
  x.strokeStyle=f.gold;x.lineWidth=1.6;x.globalAlpha=.7;
  for(const k of [-.3,0,.3]){x.beginPath();x.ellipse(cx,cy,s*0.5*Math.abs(k)*2||1,s*0.6,0,0,Math.PI*2);x.stroke()}
  x.globalAlpha=1;
  if(ch){x.fillStyle=f.gold;x.font=`700 ${Math.round(s*0.5)}px ${DISP}`;x.textAlign="center";x.textBaseline="middle";x.fillText(ch,cx,cy+s*.03)}
  x.strokeStyle=f.gold;x.lineWidth=2;for(let i=-3;i<=3;i++){x.beginPath();x.moveTo(cx+i*s*0.03,cy+s*0.66);x.lineTo(cx+i*s*0.045,cy+s*1.0);x.stroke()}
  x.restore();
}
function burst(x,f,cx,cy,r,n,color){
  x.save();x.strokeStyle=color;x.fillStyle=color;x.lineWidth=3;x.lineCap="round";
  for(let i=0;i<n;i++){const a=i*2*Math.PI/n;x.beginPath();x.moveTo(cx+Math.cos(a)*r*.3,cy+Math.sin(a)*r*.3);x.lineTo(cx+Math.cos(a)*r*.85,cy+Math.sin(a)*r*.85);x.stroke();
    circle(x,cx+Math.cos(a)*r,cy+Math.sin(a)*r,4);x.fill()}
  x.restore();
}
function mountains(x,f,base,layers){
  layers.forEach((L,i)=>{x.fillStyle=L.c;x.beginPath();x.moveTo(60,base);
    L.p.forEach(([px,py],j)=>{const prev=j?L.p[j-1]:[60,base];x.quadraticCurveTo((prev[0]+px)/2,Math.min(prev[1],py)-L.k,px,py)});
    x.lineTo(940,base);x.closePath();x.fill();
    x.strokeStyle=f.gold;x.globalAlpha=.6;x.lineWidth=2;x.stroke();x.globalAlpha=1});
}
function pine(x,f,cx,base,s){
  x.save();x.fillStyle=f.paper2;x.strokeStyle=f.gold;x.lineWidth=2.5;
  x.fillRect(cx-s*.06,base-s*.5,s*.12,s*.5);x.strokeRect(cx-s*.06,base-s*.5,s*.12,s*.5);
  [[.95,.55],[.75,.45],[.55,.36]].forEach(([y,w],i)=>{const ty=base-s*y-s*.45;x.beginPath();x.moveTo(cx,ty);x.lineTo(cx-s*w,base-s*y+s*.05);x.lineTo(cx+s*w,base-s*y+s*.05);x.closePath();x.fill();x.stroke()});
  x.restore();
}

/* the first two designs per festival, kept from the original version */
const LEGACY = {
  spring(x,f){
    // 春聯 strips
    const strip=(sx,text)=>{x.fillStyle=f.paper2;x.fillRect(sx,215,84,690);x.strokeStyle=f.gold;x.lineWidth=3;x.strokeRect(sx+6,221,72,678);
      x.fillStyle=f.gold;x.font=`700 72px ${DISP}`;vText(x,text,sx+42,240,72,22)};
    strip(830,f.couplet[0]); strip(86,f.couplet[1]);
    lantern(x,f,330,190,330,120,"春");lantern(x,f,670,190,330,120,"喜");
    // 斗方
    x.save();x.translate(500,590);x.rotate(Math.PI/4);x.fillStyle=f.gold;x.fillRect(-150,-150,300,300);
    x.strokeStyle=f.paper2;x.lineWidth=4;x.strokeRect(-138,-138,276,276);x.restore();
    x.fillStyle=f.paper2;x.font=`700 230px ${DISP}`;x.textAlign="center";x.textBaseline="middle";x.fillText("福",500,600);
    return 880;
  },
  yuanxiao(x,f){
    stars(x,f,7,70,[70,190,930,940]);
    x.fillStyle=f.gold;x.globalAlpha=.9;circle(x,800,280,70);x.fill();x.globalAlpha=1;
    x.strokeStyle=f.gold;x.lineWidth=3;x.beginPath();x.moveTo(90,215);x.quadraticCurveTo(500,290,910,215);x.stroke();
    lantern(x,f,250,240,450,150,"元");lantern(x,f,500,255,540,200,"宵");lantern(x,f,750,240,450,150,"樂");
    return 870;
  },
  duanwu(x,f){
    // leaves
    x.save();x.fillStyle="#2f7a52";x.strokeStyle=f.gold;x.lineWidth=2;
    [[-0.5,250],[0.45,760]].forEach(([a,px])=>{x.save();x.translate(px,330);x.rotate(a);x.beginPath();x.ellipse(0,0,40,150,0,0,Math.PI*2);x.fill();x.stroke();x.beginPath();x.moveTo(0,-140);x.lineTo(0,140);x.stroke();x.restore()});

          for (let i = 0; i < 16; i++) { const a = i * TAU / 16 - Math.PI / 2; mini(x, f, cx + Math.cos(a) * 262, cy + Math.sin(a) * 262, 24, i % 2 ? "#ffb347" : "#ff6a48"); }
          coin(x, f, 150, 290, 42); coin(x, f, 850, 290, 42); coin(x, f, 140, 620, 38); coin(x, f, 860, 620, 38);
          cloud(x, f, 190, 800, .65, f.paper); cloud(x, f, 810, 800, .65, f.paper);
          return 895;
        } },
    ],
  });
})();
/* ---------- full card ---------- */
function wrapLines(x,text,maxW,indentPx){
  const lines=[];let line="",first=true;
  for(const ch of text){
    const lim=first?maxW-indentPx:maxW;
    if(x.measureText(line+ch).width>lim && line){
      if("，。、！？：；」』）".includes(ch)){line+=ch;lines.push({t:line,first});line="";first=false;continue}
      lines.push({t:line,first});line=ch;first=false;
    } else line+=ch;
  }
  if(line) lines.push({t:line,first});
  return lines;
}
function recipient(){const v=$("toSel").value;return v==="__custom"?$("toCustom").value.trim():v}
function curDesign(f){return f.designs[tplIdx%f.designs.length]}
function curPhrase(){const d=curDesign(cur);return phraseOf(Object.assign({},cur,d.phrase?{phrase:d.phrase}:{}))}
function drawCard(c){
  const d0=curDesign(cur);
  // a design may bring its own palette and phrase
  const f=Object.assign({},cur,d0.colors||{},d0.phrase?{phrase:d0.phrase}:{}), x=c.getContext("2d");
  x.setTransform(1,0,0,1,0,0);x.clearRect(0,0,W,H);x.globalAlpha=1;
  // paper
  x.fillStyle=f.paper;x.fillRect(0,0,W,H);
  let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,"rgba(255,255,255,.06)");g.addColorStop(1,"rgba(0,0,0,.25)");x.fillStyle=g;x.fillRect(0,0,W,H);
  x.globalAlpha=.07;x.fillStyle=f.gold;for(let yy=22;yy<H;yy+=44)for(let xx=22;xx<W;xx+=44){circle(x,xx,yy,2.2);x.fill()}x.globalAlpha=1;
  // template art
  x.save();x.beginPath();x.rect(44,44,W-88,H-88);x.clip();const phraseY=d0.draw(x,f);x.restore();
  // phrase
  x.save();x.fillStyle=f.gold;x.font=`700 72px ${DISP}`;x.textAlign="center";x.textBaseline="middle";
  x.shadowColor="rgba(0,0,0,.35)";x.shadowBlur=12;
  try{x.letterSpacing="20px"}catch(e){} x.fillText(phraseOf(f),W/2+10,phraseY);x.restore();
  // frame
  x.strokeStyle=f.gold;x.globalAlpha=.9;x.lineWidth=3;x.strokeRect(28,28,W-56,H-56);x.globalAlpha=.5;x.lineWidth=1;x.strokeRect(40,40,W-80,H-80);x.globalAlpha=1;
  const corner=(tx,ty,sx,sy)=>{x.save();x.translate(tx,ty);x.scale(sx*2,sy*2);x.lineWidth=1.5;x.strokeStyle=f.gold;
    x.beginPath();x.moveTo(4,40);x.lineTo(4,4);x.lineTo(40,4);x.moveTo(10,34);x.lineTo(10,10);x.lineTo(34,10);x.moveTo(10,22);x.lineTo(18,22);x.lineTo(18,14);x.stroke();
    x.fillStyle=f.gold;circle(x,18,14,2);x.fill();x.restore()};
  corner(16,16,1,1);corner(W-16,16,-1,1);corner(16,H-16,1,-1);corner(W-16,H-16,-1,-1);
  // header
  x.fillStyle=f.gold;x.textBaseline="top";x.textAlign="left";x.font=`700 60px ${DISP}`;x.fillText(f.name,96,92);
  x.fillStyle=INK;x.globalAlpha=.85;x.textAlign="right";x.font=`26px ${BODY}`;const o=occ(f);x.fillText(fmtDate(o.date),904,100);
  x.font=`24px ${BODY}`;x.fillText(`${o.gz}年　農曆${o.lunar}`,904,138);x.globalAlpha=1;
  // message panel
  x.fillStyle="rgba(0,0,0,.18)";x.fillRect(80,975,W-160,350);
  x.strokeStyle=f.gold;x.globalAlpha=.6;x.lineWidth=1.5;x.strokeRect(80,975,W-160,350);x.globalAlpha=1;
  x.textAlign="left";x.textBaseline="alphabetic";x.fillStyle=INK;
  const L=120,maxW=W-2*L,lh=62;let y=1045;
  const to=recipient(),from=$("fromIn").value.trim(),msg=msgOf(f);
  if(to){x.font=`600 34px ${BODY}`;x.fillText(`親愛的${to}：`,L,y);y+=lh}
  x.font=`34px ${BODY}`;
  for(const ln of wrapLines(x,msg,maxW,68)){x.fillText(ln.t,ln.first?L+68:L,y);y+=lh}
  if(from){x.font=`600 34px ${BODY}`;x.textAlign="right";x.fillText(from,W-L,Math.max(y+4,1295))}
  c.setAttribute("aria-label",`${year} ${f.name}賀卡：${phraseOf(f)}。${to?"親愛的"+to+"："+" ":""}${msg}${from?" "+from:""}`);
}

/* ---------- UI ---------- */
// default: the next festival from today, in whatever year it falls
function pickDefault(){
  for(const y of YEARS){const hit=FESTS.filter(f=>dayDiff(TABLE[y][f.id][0])>=0).sort((a,b)=>TABLE[y][a.id][0]<TABLE[y][b.id][0]?-1:1)[0];
    if(hit) return {y,f:hit,d:dayDiff(TABLE[y][hit.id][0])}}
  return {y:YEARS[YEARS.length-1],f:FESTS[0],d:null};
}
function buildYears(){
  const sel=$("yearSel");YEARS.forEach(y=>{const o=document.createElement("option");o.value=y;o.textContent=`${y} 年（${ganzhi(y)}・${ZOD[(y-4)%12]}年）`;sel.appendChild(o)});
  sel.addEventListener("change",()=>{year=Number(sel.value);buildChips();render(true)});
}
function buildChips(){
  const box=$("festChips");box.textContent="";
  [...FESTS].sort((a,b)=>TABLE[year][a.id][0]<TABLE[year][b.id][0]?-1:1).forEach(f=>{
    const b=document.createElement("button");b.type="button";b.className="chip";b.dataset.id=f.id;
    const [,m,d]=TABLE[year][f.id][0].split("-").map(Number);b.innerHTML=`${f.name}<small>${m}/${d}</small>`;b.addEventListener("click",()=>select(f.id));box.appendChild(b)});
}
function render(anim){
  const c=$("card");drawCard(c);
  const o=occ(cur);$("dateNote").textContent=`日期自動帶入：${fmtDate(o.date)}，${o.gz}年 農曆${o.lunar}`;
  $("motifNote").textContent=`${cur.name}樣板 ${tplIdx%cur.designs.length+1}／${cur.designs.length}：${curDesign(cur).motif}`;
  document.querySelectorAll(".chip").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.id===cur.id)));
  if(anim){c.classList.remove("flip");void c.offsetWidth;c.classList.add("flip")}
}
function select(id){cur=FESTS.find(f=>f.id===id);msgIdx=0;tplIdx=0;render(true)}
function cardText(){
  const to=recipient(),from=$("fromIn").value.trim(),lines=[];
  if(to)lines.push(`親愛的${to}：`);lines.push(`【${cur.name}・${curPhrase()}】`);lines.push(msgOf(cur));if(from)lines.push(from);
  return lines.join("\n");
}

$("toSel").addEventListener("change",()=>{const cu=$("toSel").value==="__custom";$("toCustom").disabled=!cu;if(cu)$("toCustom").focus();render(false)});
$("toCustom").addEventListener("input",()=>render(false));
$("fromIn").addEventListener("input",()=>render(false));
$("shuffle").addEventListener("click",()=>{msgIdx++;render(false)});
$("swapArt").addEventListener("click",()=>{tplIdx++;render(true)});
$("copy").addEventListener("click",()=>{
  const text=cardText(),note=$("copyNote");
  navigator.clipboard.writeText(text).then(()=>{note.textContent="已複製，可以貼到 LINE 或訊息裡。"},
    ()=>{note.textContent="無法自動複製，請長按下面這段文字複製：\n"+text;note.style.whiteSpace="pre-line"});
});
let downloadsApi=null;
$("dl").addEventListener("click",async()=>{
  const note=$("copyNote");
  const standalone=!window.claude;
  if(!downloadsApi&&!standalone){note.textContent="這個檢視方式無法下載，請長按或截圖保存賀卡。";return}
  try{
    const c=document.createElement("canvas");c.width=W;c.height=H;drawCard(c);
    const blob=await new Promise(r=>c.toBlob(r,"image/png"));
    const filename=`${year}${cur.name}賀卡.png`;
    if(standalone){ // opened as a plain web page: use an ordinary download link
      const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000);
    } else await downloadsApi.save({filename,data:blob});
    note.textContent="賀卡圖片已下載。";
  }catch(e){note.textContent=e&&e.code==="declined"?"已取消下載。":"下載沒有成功，請改用截圖保存賀卡。"}
});
if(window.claude)(async()=>{try{downloadsApi=await window.claude.use("downloads")}catch(e){}if(!downloadsApi)$("dl").hidden=true})();

const def=pickDefault();year=def.y;cur=def.f;
buildYears();$("yearSel").value=String(year);buildChips();
if(def.d!==null)$("nextNote").textContent=def.d===0?`今天就是${cur.name}！`:`最近的節日是 ${year} 年${cur.name}，還有 ${def.d} 天，已幫你選好。`;
render(false);
// redraw once the web fonts arrive so canvas text uses them
Promise.all([document.fonts.load(`700 60px "LXGW WenKai TC"`,"重陽節冬至聖誕元旦春宵母親端午父中秋福壽安康團圓添歲平喜樂新禧三羊開泰花好月慈恩永念如山金獻瑞家紫燕迎戶歡元宵樂2027"),
  document.fonts.load(`34px "Noto Serif TC"`,"親愛的"),document.fonts.load(`600 34px "Noto Serif TC"`,"親愛的")])
  .catch(()=>{}).then(()=>document.fonts.ready).then(()=>render(false));
</script>
